# Crystal Ball reagent lexicon
#
# The load-bearing curation artefact of Phase 0: every downstream stage keys off these
# canonical ids. Validated on load by crystal_ball.parse.lexicon; an alias claimed by two
# reagents is a hard error.
#
# Aliases are drawn from the actual corpus ranking produced by `./run.sh parse.mine_reagents`
# over 198,918 X-ray records, not invented. Measure the effect of any edit with
# `./run.sh parse.lexicon_coverage`.
#
# Fields
#   chem_class        peg | organic | salt | buffer | polyol | detergent | premix | additive | other
#   peg_mw            required for chem_class peg. Ordinal, log-scaled downstream.
#   hofmeister_rank   anion position: negative kosmotropic (salting out), 0 chloride,
#                     positive chaotropic. sulfate -4 ... thiocyanate +4.
#   buffer_pka        pKa at 25 C. Buffers collapse to the pH they set (spec 6.3).
#   default_unit      what the concentration means when the text omits w/v or v/v.
#
# DELIBERATELY NOT MAPPED, pending Marc's decision. These are ambiguous and guessing would
# be worse than leaving them in the curation worklist:
#   "peg"        bare, no molecular weight. Spec 5.1 lists this as a discard case.
#   "citrate"    sodium, tri-sodium, ammonium or potassium? ~1,288 clauses.
#   "acetate"    sodium, ammonium, magnesium, calcium or zinc? ~774 clauses.
#   "phosphate"  sodium, potassium or mixed Na/K? ~262 clauses.

version: 0.1.0

